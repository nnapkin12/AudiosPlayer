[package]
name = "audios"
version = "0.3.1"
description = "A local music player and metadata editor"
authors = ["Audios Player contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "audios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
directories = "6"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
lofty = "0.22"
rodio = { version = "0.20", features = ["symphonia-all"] }
log = "0.4"
notify = "6"
qrcode = { version = "0.14", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
walkdir = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Published crates.io feature. It enables souvlaki's own zbus 3 dependency.
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
